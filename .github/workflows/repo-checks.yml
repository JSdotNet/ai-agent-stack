name: Repository checks

# The four checks this repository's own assets have to pass. Two of them are
# the pre-commit pair named in AGENTS.md; the third runs the tools' own tests,
# which nothing ran automatically before; the fourth is the strict plugin
# validator, which is the only thing that catches an unknown manifest field or
# a bad dependency range.
#
# This workflow never regenerates and never commits the derived `_meta/`
# indexes. `--check` reads them and reports; the refresh stays with the
# `devbook-validate` schedule, per .devbook/arc42/adr/checks-and-indexes.md.
#
# No path filters, deliberately. Every folder here is authored assets that one
# of the four checks reads, and a filter that silently matches nothing leaves
# the repository with no gate and no error saying so.

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review beside the defaults, so marking a draft ready runs the
    # checks again: auto-merge.yml starts on that event and judges the head
    # commit's latest check runs, which would otherwise be the draft's.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Assets, devbook metadata, tool tests, and plugin manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The scripts and their tests import only stable `node:` builtins, so the
      # runner image's Node is enough and no setup-node pin is needed.
      - name: Check manifest, agent, and hook shapes
        run: node tools/check-assets.mjs

      - name: Check devbook metadata and references
        run: node plugins/devbook/tools/devbook-meta/build.mjs --check

      # The files are listed, never the folder: `node --test <dir>` loads
      # nothing on Windows, and a glob over one folder misses a test added in a
      # new one without saying so. In a git pathspec `*` crosses `/`, so these
      # two patterns reach every depth.
      - name: Run the tool tests
        run: |
          set -uo pipefail
          mapfile -t tests < <(git ls-files -- 'plugins/*.test.mjs' 'tools/*.test.mjs')
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::No *.test.mjs files found under plugins/ or tools/ — the checkout is wrong."
            exit 1
          fi
          node --test "${tests[@]}"

      # Deliberately unpinned. The validator earns its place by knowing the
      # host's current manifest schema, so pinning it would freeze the one
      # thing it is here to catch. The cost is that a CLI release can turn this
      # red without a change in this repository.
      - name: Install the Claude Code CLI
        run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code

      # `validate` is a local schema check: it needs no API key and no config
      # directory. Every manifest is reported before the step fails, so one bad
      # plugin does not hide the next.
      - name: Validate the marketplace and every plugin manifest
        run: |
          set -uo pipefail
          shopt -s nullglob
          manifests=(plugins/*/.claude-plugin/plugin.json)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "::error::No plugin manifests found under plugins/*/.claude-plugin/ — the checkout is wrong."
            exit 1
          fi
          status=0
          claude plugin validate --strict . || status=1
          for manifest in "${manifests[@]}"; do
            plugin="${manifest%/.claude-plugin/plugin.json}"
            claude plugin validate --strict "$plugin" || status=1
          done
          exit $status
